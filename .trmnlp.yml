# TRMNLP configuration
# {{ env.VARIABLE }} interpolation is available here
---
# auto-reload when files change (`watch: false` to disable)
watch:
  - .trmnlp.yml
  - src

# values of custom fields (defined in src/settings.yml)
custom_fields:
  distance_unit: Miles

# override variables — mock Strava data shaped like transform.js's return
# value, so `trmnlp serve` renders something meaningful without needing a
# live OAuth connection during local preview.
variables:
  trmnl: {}
  hasMostRecent: true
  mostRecent:
    id: 1
    name: Morning Ride
    startDateLocal: '2026-08-15T07:28:37'
    distance: 38.6 mi
