# TRMNLP configuration
# {{ env.VARIABLE }} interpolation is available here
---
# auto-reload when files change (`watch: false` to disable)
watch:
  - .trmnlp.yml
  - src

# values of custom fields (defined in src/settings.yml)
custom_fields:
  distance_unit: Miles

# override variables — since strategy: polling always attempts a live poll
# (which fails locally with no OAuth token), we inject `data` here instead:
# trmnlp deep-merges these into the payload it hands to transform.js, and
# transform.js's `activitiesFromInput` picks up a top-level `data` array
# exactly like it would from a real `{ data: [...] }`-wrapped poll response.
# This is real ride data (pulled from the connected Strava account) shaped
# like Strava's raw /athlete/activities response, so it exercises transform.js
# itself — not just the Liquid templates — the same as a live poll would.
variables:
  trmnl: {}
  data:
