---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: 3.2.0
serverless_language: node
polling_url: https://www.strava.com/api/v3/athlete/activities?per_page=30
polling_headers: 'Authorization: Bearer {{ oauth_access_token }}'
polling_body: ''
id: 444560
oauth_enabled: 'true'
oauth_pkce_enabled: 'yes'
oauth_authorize_url: https://www.strava.com/oauth/authorize
oauth_token_url: https://www.strava.com/oauth/token
oauth_scopes: read,activity:read_all
oauth_scope_separator: ','
oauth_refresh_url: ''
oauth_auth_params: '{"approval_prompt":"force"}'
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: distance_unit
  name: Distance Unit
  field_type: select
  options:
  - Miles
  - Kilometers
  default: Miles
  description: Units used for distance, elevation, and speed across all layouts.
- keyname: about_this_plugin
  name: About This Plugin
  field_type: author_bio
  email_address: pedrodiazvargas@gmail.com
  category: sports,entertainment
  description: Shows your most recent ride and a Monday–Sunday weekly cycling summary, pulled from Strava. Rides only (no runs, swims, or other activity types). Not affiliated with, endorsed by, or sponsored by Strava.
name: Strava Stats
description: Last ride + weekly cycling summary
refresh_interval: 15
